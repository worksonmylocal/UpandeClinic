<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Clinic Insights · Northlake Medical Centre</title>
<link rel="icon" type="image/svg+xml" href="/assets/clinic/images/northlake-mark.svg">
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500;9..144,600;9..144,700&family=Poppins:wght@400;500;600;700&family=Cormorant+Garamond:wght@500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="/assets/clinic/css/clinic_desk.css?v={{ asset_version }}">
<script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.0/dist/chart.umd.min.js"></script>
</head>
<body>
<div id="topbar"></div>
<div class="page">
  <div class="pagehead" id="pagehead"></div>
  <div class="card" style="padding:18px 22px;margin-bottom:18px">
    <div class="att-filters">
      <div class="field"><label>Year</label><select id="f-year"></select></div>
      <div class="field"><label>Month</label><select id="f-month"><option value="">All</option></select></div>
      <div class="field"><label>From</label><input type="date" id="f-from"></div>
      <div class="field"><label>To</label><input type="date" id="f-to"></div>
      <div class="field"><label>Department</label><select id="f-dept"><option value="">All</option></select></div>
      <div class="att-quick"><button class="btn btn--sm" id="f-clear">Clear dates</button></div>
    </div>
  </div>
  <div class="tabs" id="views"></div>
  <div id="view"><div class="skel"></div></div>
</div>
<script>window.CLINIC = { csrf: {{ csrf_token | tojson }}, user: {{ frappe.session.user | tojson }} };</script>
<script src="/assets/clinic/js/clinic_desk.js?v={{ asset_version }}"></script>
<script src="/assets/clinic/js/insights.js?v={{ asset_version }}"></script>
</body>
</html>
