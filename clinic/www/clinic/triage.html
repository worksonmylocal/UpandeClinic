<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Triage · Northlake Medical Centre</title>
<link rel="icon" type="image/svg+xml" href="/assets/clinic/images/northlake-mark.svg">
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500;9..144,600;9..144,700&family=Poppins:wght@400;500;600;700&family=Cormorant+Garamond:wght@500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="/assets/clinic/css/clinic_desk.css?v={{ asset_version }}">
<script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.0/dist/chart.umd.min.js"></script>
</head>
<body>
<div id="topbar"></div>
<div class="page">
  <div class="pagehead" id="pagehead"></div>
  <div class="kpi-grid" id="kpis"><div class="skel"></div><div class="skel"></div><div class="skel"></div><div class="skel"></div><div class="skel"></div><div class="skel"></div></div>
  <div class="tabs">
    <button class="tab on" data-tab="queue">Queue</button>
    <button class="tab" data-tab="insights">Insights</button>
  </div>
  <div class="tabpanel on" id="tab-queue">
    <div class="row-2-eq">
      <div class="card"><div class="card__head"><h3>Waiting for Triage</h3><span class="meta" id="waiting-meta"></span></div><div class="queue" id="waiting"><div class="skel"></div></div></div>
      <div class="card"><div class="card__head"><h3>Sent Onward Today</h3><span class="meta" id="recent-meta"></span></div><div class="queue" id="recent"><div class="skel"></div></div></div>
    </div>
  </div>
  <div class="tabpanel" id="tab-insights">
    <div class="ins-bar"><div id="period"></div><span class="meta" id="range-meta" style="font-size:12px;color:var(--ink-mute)"></span></div>
    <div class="row-2-eq">
      <div class="card"><div class="card__head"><h3>Door to Triage Wait</h3><span class="meta" id="door-meta"></span></div><div class="kpi-grid" id="door-kpis" style="margin-bottom:12px;grid-template-columns:repeat(3,1fr)"></div><div id="door-bars"><div class="skel"></div></div></div>
      <div class="card"><div class="card__head"><h3>Triage Priority</h3><span class="meta" id="priority-meta"></span></div><div class="ring"><canvas id="priority-chart" width="260" height="260"></canvas><div class="ring__mid" id="priority-mid"></div></div><div class="pchips" id="priority-chips"></div></div>
    </div>
    <div class="card"><div class="card__head"><h3>Screening Flags</h3><span class="meta" id="flag-meta"></span></div><div id="flags"><div class="skel"></div></div><div class="lvl-legend"><span><i style="background:var(--good)"></i>Under 10% of patients</span><span><i style="background:#e68a00"></i>10–25%</span><span><i style="background:var(--bad)"></i>Over 25%</span></div></div>
    <div class="card chart-wrap"><div class="card__head"><h3>Arrivals by Hour</h3></div><div style="position:relative;height:260px"><canvas id="hour-chart"></canvas></div></div>
  </div>
</div>
<script>window.CLINIC = { csrf: {{ csrf_token | tojson }}, user: {{ frappe.session.user | tojson }} };</script>
<script src="/assets/clinic/js/clinic_desk.js?v={{ asset_version }}"></script>
<script src="/assets/clinic/js/triage.js?v={{ asset_version }}"></script>
</body>
</html>
